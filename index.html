<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1><span class="logo">&#9729;</span> weather</h1>
      <p class="tagline">Real-time weather </p>
    </header>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter a city" autocomplete="off">
      <button id="search-btn">Search</button>
    </div>
    <p id="error" class="error hidden"></p>

    <div id="loading" class="loading hidden">Loading weather...</div>

    <main id="weather" class="hidden">
      <section class="current-card">
        <div class="current-info">
          <h2 id="city-name">--</h2>
          <p id="country-name">--</p>
          <p id="local-date">--</p>
          <h3 id="temperature">--</h3>
          <p id="description">--</p>
        </div>
        <div class="current-icon">
          <span id="weather-icon">&#9925;</span>
        </div>
      </section>

      <section class="details-grid">
        <div class="detail"><span class="label">Feels Like</span><span id="feels-like">--</span></div>
        <div class="detail"><span class="label">Humidity</span><span id="humidity">--</span></div>
        <div class="detail"><span class="label">Wind</span><span id="wind">--</span></div>
        <div class="detail"><span class="label">Pressure</span><span id="pressure">--</span></div>
        <div class="detail"><span class="label">Rain</span><span id="precipitation">--</span></div>
        <div class="detail"><span class="label">UV Index</span><span id="uv-index">--</span></div>
      </section>

      <section class="forecast">
        <h3>7-Day Forecast</h3>
        <div id="forecast-list"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
